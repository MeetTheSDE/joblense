<!DOCTYPE html>
<html>
    <head>
        <title>Keyword Highlighter Settings</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                width: 250px;
                margin: 0;
                padding: 16px;
                background-color: #f9fafb;
                color: #333;
            }
            h2 {
                font-size: 18px;
                margin-bottom: 12px;
                color: #0a66c2;
            }
            textarea {
                width: 100%;
                height: 80px;
                padding: 10px;
                font-size: 14px;
                border: 1px solid #ccc;
                border-radius: 6px;
                resize: none;
                margin-bottom: 12px;
                box-sizing: border-box;
            }
            button {
                background-color: #0a66c2;
                color: white;
                padding: 8px 12px;
                border: none;
                border-radius: 4px;
                font-size: 14px;
                cursor: pointer;
            }
            button:hover {
                background-color: #004182;
            }
            .note {
                font-size: 12px;
                color: #666;
                margin-top: 8px;
            }
        </style>
    </head>
    <body>
        <h2>Highlight Keywords</h2>
        <textarea
            id="keywords"
            placeholder="e.g. Kotlin, React, Go etc."
        ></textarea>
        <button id="save">Save</button>
        <div class="note">
            These keywords will be highlighted across LinkedIn posts
            automatically.
        </div>
        <div
            id="status"
            style="color: green; margin-top: 10px; font-size: 14px"
        ></div>

        <script src="popup.js"></script>
    </body>
</html>
